# =============================================================================
# nginx-check Job + RBAC
#
# Logic:
#   1. List all Ingresses in the cluster and look for ingressClassName "nginx"
#      (also matches the legacy `kubernetes.io/ingress.class: nginx` annotation).
#   2. If the `kubectl get ingress` call FAILS  -> do nothing (exit 0).
#   3. If at least one nginx Ingress exists     -> do nothing (exit 0).
#   4. If NO nginx Ingress exists               -> patch the target ConfigMap
#      to add  nginx_install: skip
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-check
  namespace: default            # <-- namespace where the Job runs
---
# ClusterRole: cluster-wide read on ingresses + patch on configmaps
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nginx-check
rules:
  # Needed to list ingresses across all namespaces
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  # Needed to read + patch the target configmap
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nginx-check
subjects:
  - kind: ServiceAccount
    name: nginx-check
    namespace: default          # <-- must match the ServiceAccount namespace
roleRef:
  kind: ClusterRole
  name: nginx-check
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nginx-check
  namespace: default
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300   # auto-clean the Job 5 min after completion
  template:
    metadata:
      labels:
        app: nginx-check
    spec:
      serviceAccountName: nginx-check
      restartPolicy: Never
      containers:
        - name: nginx-check
          image: bitnami/kubectl:latest
          env:
            # Target ConfigMap to patch and its namespace
            - name: TARGET_NAMESPACE
              value: "default"
            - name: TARGET_CONFIGMAP
              value: "cluster-config"
            # Ingress class we are looking for
            - name: INGRESS_CLASS
              value: "nginx"
          command:
            - /bin/bash
            - -c
            - |
              set -uo pipefail

              # ---------------------------------------------------------------
              # HOOK: custom reconciliation
              #   Placeholder for any extra reconciliation logic you want to run.
              #   Called at the end of the script (see invocation below).
              #   Intentionally empty for now.
              # ---------------------------------------------------------------
              custom_reconcile() {
                :   # no-op — add custom reconciliation logic here
              }

              echo "[nginx-check] Looking for Ingresses with class '${INGRESS_CLASS}'..."

              # ---------------------------------------------------------------
              # 1. Try to list ingresses across all namespaces, emitting one line
              #    per Ingress:  <spec.ingressClassName>|<legacy class annotation>
              #    If this call FAILS for any reason -> do nothing (exit 0).
              # ---------------------------------------------------------------
              if ! ingress_data=$(kubectl get ingress --all-namespaces \
                    -o jsonpath="{range .items[*]}{.spec.ingressClassName}{'|'}{.metadata.annotations.kubernetes\.io/ingress\.class}{'\n'}{end}" \
                    2>/tmp/err); then
                echo "[nginx-check] ERROR: failed to get ingresses:"
                cat /tmp/err
                echo "[nginx-check] Doing nothing and exiting cleanly."
                exit 0
              fi

              # ---------------------------------------------------------------
              # 2. Count nginx ingresses. Matches either:
              #      spec.ingressClassName == nginx                            (modern)
              #      annotation kubernetes.io/ingress.class == nginx           (legacy)
              # ---------------------------------------------------------------
              nginx_count=$(printf '%s\n' "$ingress_data" | grep -c -w "${INGRESS_CLASS}" || true)

              echo "[nginx-check] Found ${nginx_count} nginx Ingress(es)."

              # ---------------------------------------------------------------
              # 3. If at least one nginx ingress exists -> do nothing.
              # ---------------------------------------------------------------
              if [ "${nginx_count}" -gt 0 ]; then
                echo "[nginx-check] nginx is already installed. No action taken."
                exit 0
              fi

              # ---------------------------------------------------------------
              # 4. No nginx ingress -> patch the configmap with nginx_install: skip
              # ---------------------------------------------------------------
              echo "[nginx-check] No nginx Ingress found. Patching ConfigMap '${TARGET_CONFIGMAP}' in namespace '${TARGET_NAMESPACE}'."
              if kubectl patch configmap "${TARGET_CONFIGMAP}" \
                   -n "${TARGET_NAMESPACE}" \
                   --type merge \
                   -p '{"data":{"nginx_install":"skip"}}'; then
                echo "[nginx-check] ConfigMap patched successfully."
              else
                echo "[nginx-check] ERROR: failed to patch ConfigMap."
                exit 1
              fi

              # ---------------------------------------------------------------
              # Run custom reconciliation hook (no-op for now)
              # ---------------------------------------------------------------
              echo "[nginx-check] Running custom reconciliation hook..."
              custom_reconcile
